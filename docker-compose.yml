x-app-environment: &app-environment
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Run npm run docker:prepare to configure the Docker database}
    NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    AUTH_TRUST_HOST: "true"

services:
    db:
        image: postgres:16
        restart: unless-stopped
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-team_monitor}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER or run npm run docker:prepare}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or run npm run docker:prepare}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    app:
        build:
            context: .
            target: runner
        restart: unless-stopped
        ports:
            - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000"
        depends_on:
            db:
                condition: service_healthy
        env_file: ${APP_ENV_FILE:-.env}
        environment: *app-environment
        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ui-config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 60s

    sync:
        build:
            context: .
            target: sync-runner
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
        env_file: ${APP_ENV_FILE:-.env}
        environment: *app-environment
        command: node /app/scripts/sync-cron.js

volumes:
    pgdata:
